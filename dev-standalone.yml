services:
  odoo:
    volumes:
      # Host paths (odoo modules, src code & conf)
      - ./custom:${ODOO_EXTRA_ADDONS}:delegated
    environment:
      - LOG_LEVEL=debug
      - WITHOUT_DEMO=False
    depends_on:
      db:
        condition: service_healthy
    command: ['odoo', '--dev', 'reload,qweb,xml']
