services:
  odoo:
    volumes:
      # Host paths (odoo modules, src code & conf)
      - ./custom:${ODOO_EXTRA_ADDONS}:delegated
      - ./src/odoo:/${ODOO_BASEPATH}:cached
    environment:
      - LOG_LEVEL=debug
      - WITHOUT_DEMO=False
    depends_on:
      db:
        condition: service_healthy
    command: ['${ODOO_CMD}', '--dev', 'reload,qweb,xml']
