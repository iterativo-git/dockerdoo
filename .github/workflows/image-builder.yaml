name: Build and test one Odoo image

on:
  workflow_call:
    inputs:
      odoo_version:
        required: true
        type: string
      odoo_ref:
        required: true
        type: string
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      stage_tag:
        required: true
        type: string
      publish_stage:
        required: false
        type: boolean
        default: false
      no_cache:
        description: Disable the Docker cache for this build
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  build-test:
    name: Odoo ${{ inputs.odoo_version }} on ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ghcr.io/iterativo-git/dockerdoo
          flavor: latest=false
          tags: type=raw,value=${{ inputs.stage_tag }}
          labels: |
            org.iterativo.odoo.version=${{ inputs.odoo_version }}
            org.iterativo.odoo.revision=${{ inputs.odoo_ref }}

      - name: Build local image
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          file: Dockerfile
          target: production
          platforms: ${{ inputs.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ODOO_VERSION=${{ inputs.odoo_version }}
            ODOO_REF=${{ inputs.odoo_ref }}
            PYTHON_VERSION=3.12-slim
            OS_VARIANT=bookworm
          load: true
          no-cache: ${{ inputs.no_cache }}
          cache-from: type=gha,scope=odoo-${{ inputs.odoo_version }}-${{ inputs.platform }}
          cache-to: type=gha,mode=max,scope=odoo-${{ inputs.odoo_version }}-${{ inputs.platform }}

      - name: Run native runtime and Odoo tests
        env:
          IMAGE: ghcr.io/iterativo-git/dockerdoo:${{ inputs.stage_tag }}
        run: >-
          python3 tests/test_runtime.py
          --image "$IMAGE"
          --odoo-version "${{ inputs.odoo_version }}"
          --native-tests

      - name: Upload runtime test logs after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: runtime-logs-${{ inputs.odoo_version }}-${{ inputs.stage_tag }}
          path: |
            /tmp/dockerdoo-test-*
            !/tmp/dockerdoo-test-*/test.env
          if-no-files-found: ignore
          retention-days: 7

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish_stage }}
        uses: docker/login-action@v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: ${{ inputs.publish_stage }}
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push tested platform images
        if: ${{ inputs.publish_stage }}
        env:
          IMAGE: ghcr.io/iterativo-git/dockerdoo:${{ inputs.stage_tag }}
          DOCKER_HUB_IMAGE: iterativodo/dockerdoo:${{ inputs.stage_tag }}
        run: |
          docker tag "$IMAGE" "$DOCKER_HUB_IMAGE"
          docker push "$IMAGE"
          docker push "$DOCKER_HUB_IMAGE"
