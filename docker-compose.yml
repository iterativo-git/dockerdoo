services:
  odoo:
    image: iterativodo/dockerdoo:${ODOO_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - ODOO_VERSION=${ODOO_VERSION}
        - PYTHON_VERSION=${PYTHON_VERSION}
        - OS_VARIANT=${OS_VARIANT}
        - WKHTMLTOX_VERSION=${WKHTMLTOX_VERSION}
    env_file: .env

    environment:
      POSTGRES_ADMIN_USER: ""
      POSTGRES_ADMIN_PASSWORD: ""
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      LIST_DB: ${LIST_DB:-False}

    restart: unless-stopped

    ports:
      - 8069:8069
      - 8072:8072

    volumes:
      # Named volumes
      - odoo-data:${ODOO_DATA_DIR}
      - odoo-testlogs:${ODOO_LOGS_DIR}
      - odoo-modules:${ODOO_EXTRA_ADDONS}
    depends_on:
      db:
        condition: service_healthy
  # ------------------------
  db:
    image: postgres:${PSQL_VERSION}
    restart: always
    volumes:
      - psql:/var/lib/postgresql/data/pgdata
      - ./resources/postgres-app-role.sql:/docker-entrypoint-initdb.d/10-postgres-app-role.sql:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD}
      - POSTGRES_USER=${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
      - POSTGRES_APP_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - POSTGRES_APP_USER=${POSTGRES_USER:?set POSTGRES_USER}
      - PGDATA=/var/lib/postgresql/data/pgdata
      # Odoo expects the database to be created with the C collate
      - POSTGRES_INITDB_ARGS=--lc-collate=C
    healthcheck:
      test: ['CMD-SHELL', 'PGPASSWORD="$${POSTGRES_APP_PASSWORD}" psql -h db -U "$${POSTGRES_APP_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -qAtc "SELECT COALESCE(bool_and(NOT rolsuper AND rolcreatedb AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls AND NOT pg_has_role(current_user, ''pg_execute_server_program'', ''MEMBER'') AND NOT pg_has_role(current_user, ''pg_read_server_files'', ''MEMBER'') AND NOT pg_has_role(current_user, ''pg_write_server_files'', ''MEMBER'')), false) FROM pg_roles WHERE rolname = current_user" | grep -qx t']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  odoo-data:
  odoo-testlogs:
  odoo-modules:
  psql:
